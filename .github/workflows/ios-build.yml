name: iOS Build

# 云端 Mac 编译：把编译器看得见的错误一次性摊开，
# 不需要本地有 Mac 就能验证工程能否编译。

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile for iOS Simulator
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 工具链版本
        run: |
          echo "::group::xcodebuild"
          xcodebuild -version
          echo "::endgroup::"
          echo "::group::xcode-select"
          xcode-select -p
          echo "::endgroup::"
          echo "::group::swift"
          swift --version
          echo "::endgroup::"

      - name: 校验工程文件格式
        continue-on-error: true
        run: plutil -lint KaoyanWorkbench.xcodeproj/project.pbxproj

      - name: 列出 scheme 与 target
        run: |
          xcodebuild -list -project KaoyanWorkbench.xcodeproj

      - name: 编译（模拟器，不签名）
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project KaoyanWorkbench.xcodeproj \
            -scheme KaoyanWorkbench \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: 提取编译错误
        if: steps.build.outcome == 'failure'
        run: |
          echo "================= COMPILE ERRORS ================="
          grep -n -E "error:|fatal error:" build.log | head -n 100 || echo "（没有匹配到 error: 行，请看完整日志）"
          echo "================= 首个 error 的上下文 ================="
          FIRST=$(grep -n -E "error:" build.log | head -n 1 | cut -d: -f1)
          if [ -n "$FIRST" ]; then
            START=$(( FIRST > 3 ? FIRST - 3 : 1 ))
            sed -n "${START},$(( START + 8 ))p" build.log
          fi
          echo "=================================================="

      - name: 上传完整日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build.log
          if-no-files-found: ignore

      - name: 结果
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::编译失败，请查看上一步的 COMPILE ERRORS 与 xcodebuild-log 工件。"
          exit 1

      - name: 成功
        run: echo "::notice::编译通过 ✅"
