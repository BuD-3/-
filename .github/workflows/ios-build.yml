name: iOS Build

# 云端 Mac 编译 + 模拟器截图 + 未签名 IPA。
#
# 省额度策略（macOS 机器按 10 倍计费）：
#   - 每次 push：只跑「编译」≈ 2.3 分钟 → 23 计费分钟
#   - 截图 / IPA 只在手动触发时跑 → 按需消耗
# 免费额度 2000 分钟/月，这样够跑约 86 轮，而不是 20 轮。

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      screenshots:
        description: "同时生成 8 张模拟器截图"
        type: boolean
        default: true
      ipa:
        description: "同时打包未签名 IPA（用于 Sideloadly 装机）"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile for iOS Simulator
    # 手动触发时跳过：截图 / IPA 任务自己会编译，不必重复
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 工具链版本
        run: |
          echo "::group::xcodebuild"
          xcodebuild -version
          echo "::endgroup::"
          echo "::group::xcode-select"
          xcode-select -p
          echo "::endgroup::"
          echo "::group::swift"
          swift --version
          echo "::endgroup::"

      - name: 校验工程文件格式
        continue-on-error: true
        run: plutil -lint KaoyanWorkbench.xcodeproj/project.pbxproj

      - name: 列出 scheme 与 target
        run: |
          xcodebuild -list -project KaoyanWorkbench.xcodeproj

      - name: 编译（模拟器，不签名）
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project KaoyanWorkbench.xcodeproj \
            -scheme KaoyanWorkbench \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: 提取编译错误
        if: steps.build.outcome == 'failure'
        run: |
          echo "================= COMPILE ERRORS ================="
          grep -n -E "error:|fatal error:" build.log | head -n 100 || echo "(no error: lines matched)"
          echo "================= context ================="
          FIRST=$(grep -n -E "error:" build.log | head -n 1 | cut -d: -f1)
          if [ -n "$FIRST" ]; then
            START=$(( FIRST > 3 ? FIRST - 3 : 1 ))
            sed -n "${START},$(( START + 8 ))p" build.log
          fi
          echo "=================================================="

      - name: 上传完整日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build.log
          if-no-files-found: ignore

      - name: 结果
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::编译失败，请查看上一步的 COMPILE ERRORS 与 xcodebuild-log 工件。"
          exit 1

      - name: 成功
        run: echo "::notice::编译通过"

  screenshots:
    name: Simulator Screenshots
    # 只在手动触发且勾选了「截图」时跑，避免每次 push 都吃掉 66 计费分钟
    if: github.event_name == 'workflow_dispatch' && inputs.screenshots == true
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 编译到 .app
        run: |
          set -o pipefail
          xcodebuild build \
            -project KaoyanWorkbench.xcodeproj \
            -scheme KaoyanWorkbench \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tail -n 20

      - name: 定位 .app
        id: app
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "KaoyanWorkbench.app" -type d | head -n 1)
          echo "找到: $APP"
          test -d "$APP" || { echo "::error::没找到 .app"; exit 1; }
          echo "path=$APP" >> "$GITHUB_OUTPUT"

      - name: 选择并启动模拟器
        id: sim
        run: |
          # 优先 iPhone 16，找不到就用任意可用 iPhone
          DEVICE="iPhone 16"
          if ! xcrun simctl list devices available | grep -q "$DEVICE ("; then
            DEVICE=$(xcrun simctl list devices available | grep -oE "iPhone [0-9][0-9A-Za-z]*" | head -n 1)
          fi
          echo "设备: $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl ui "$DEVICE" appearance light || true
          xcrun simctl status_bar "$DEVICE" override \
            --time "9:41" \
            --batteryState charged \
            --batteryLevel 100 \
            --cellularMode active \
            --cellularBars 4 \
            --wifiMode active \
            --wifiBars 3 || true
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: 安装
        run: |
          xcrun simctl install "${{ steps.sim.outputs.device }}" "${{ steps.app.outputs.path }}"

      - name: 逐页截图
        run: |
          DEVICE="${{ steps.sim.outputs.device }}"
          BUNDLE="com.kaoyan.workbench"
          mkdir -p screenshots

          # 0=今日 1=计划 2=错题 3=进度 4=我的
          NAMES=("01-today" "02-plan" "03-review" "04-progress" "05-profile")
          for i in 0 1 2 3 4; do
            NAME="${NAMES[$i]}"
            echo "--- 截取 $NAME (tab=$i) ---"
            xcrun simctl terminate "$DEVICE" "$BUNDLE" 2>/dev/null || true
            sleep 1
            xcrun simctl launch "$DEVICE" "$BUNDLE" --tab "$i" --seed-demo
            sleep 6
            xcrun simctl io "$DEVICE" screenshot "screenshots/$NAME.png"
            ls -la "screenshots/$NAME.png"
          done

          echo "--- 截取 06-library (资料库) ---"
          xcrun simctl terminate "$DEVICE" "$BUNDLE" 2>/dev/null || true
          sleep 1
          xcrun simctl launch "$DEVICE" "$BUNDLE" --library-preview --seed-demo
          sleep 6
          xcrun simctl io "$DEVICE" screenshot "screenshots/06-library.png"

          echo "--- 截取 07-today-materials (今日-学习内容) ---"
          xcrun simctl terminate "$DEVICE" "$BUNDLE" 2>/dev/null || true
          sleep 1
          xcrun simctl launch "$DEVICE" "$BUNDLE" --tab 0 --seed-demo --focus-materials
          sleep 7
          xcrun simctl io "$DEVICE" screenshot "screenshots/07-today-materials.png"

          echo "--- 截取 09-report (学习周报) ---"
          xcrun simctl terminate "$DEVICE" "$BUNDLE" 2>/dev/null || true
          sleep 1
          xcrun simctl launch "$DEVICE" "$BUNDLE" --report-preview --seed-demo
          sleep 6
          xcrun simctl io "$DEVICE" screenshot "screenshots/09-report.png"

          echo "--- 截取 08-home (桌面图标) ---"
          xcrun simctl terminate "$DEVICE" "$BUNDLE" 2>/dev/null || true
          sleep 4
          xcrun simctl io "$DEVICE" screenshot "screenshots/08-home.png"

          echo "=== 全部截图 ==="
          ls -la screenshots/

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn

  ipa:
    name: Unsigned IPA (for Sideloadly)
    # 只在手动触发且勾选了「IPA」时跑
    if: github.event_name == 'workflow_dispatch' && inputs.ipa == true
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 编译为真机 App（不签名）
        run: |
          set -o pipefail
          xcodebuild build \
            -project KaoyanWorkbench.xcodeproj \
            -scheme KaoyanWorkbench \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ENTITLEMENTS="" \
            CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO \
            2>&1 | tail -n 30

      - name: 打包成未签名 IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "KaoyanWorkbench.app" -type d | head -n 1)
          echo "找到: $APP"
          test -d "$APP" || { echo "::error::没找到真机 .app"; exit 1; }

          rm -rf Payload KaoyanWorkbench-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry KaoyanWorkbench-unsigned.ipa Payload

          echo "=== IPA 信息 ==="
          ls -lh KaoyanWorkbench-unsigned.ipa
          shasum -a 256 KaoyanWorkbench-unsigned.ipa
          echo "=== 架构 ==="
          lipo -info "$APP/KaoyanWorkbench" || true

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: KaoyanWorkbench-unsigned-ipa
          path: KaoyanWorkbench-unsigned.ipa
          if-no-files-found: error

